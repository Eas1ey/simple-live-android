name: Build Simple Live Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 下载仓库
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 解压源代码
      - name: Extract Source
        run: |
          unzip -q dart_simple_live-dev_v1.11.7.zip

      # 3. 安装 Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. 安装 Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      # 5. 获取依赖
      - name: Get Dependencies
        working-directory: dart_simple_live-dev_v1.11.7/simple_live_app
        run: |
          flutter pub get

      # 6. 编译正式版
      - name: Build Release APK
        working-directory: dart_simple_live-dev_v1.11.7/simple_live_app
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      # 7. 查找 Android 签名工具
      - name: Find APK Signer
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner | sort -V | tail -1)

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

      # 8. 生成测试签名
      - name: Generate Signing Key
        run: |
          keytool -genkeypair \
            -keystore release.jks \
            -storepass android123 \
            -keypass android123 \
            -alias simplelive \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SimpleLive, OU=Android, O=Personal, L=Tokyo, ST=Tokyo, C=JP"

      # 9. 对 APK 签名
      - name: Sign APK
        run: |
          APK="dart_simple_live-dev_v1.11.7/simple_live_app/build/app/outputs/flutter-apk/app-release.apk"

          mkdir -p output

          "$APKSIGNER" sign \
            --ks release.jks \
            --ks-key-alias simplelive \
            --ks-pass pass:android123 \
            --key-pass pass:android123 \
            --out output/SimpleLive-v1.11.7-arm64.apk \
            "$APK"

      # 10. 验证 APK 签名
      - name: Verify APK
        run: |
          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            output/SimpleLive-v1.11.7-arm64.apk

      # 11. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-v1.11.7-Release-ARM64
          path: output/SimpleLive-v1.11.7-arm64.apk
          retention-days: 30
