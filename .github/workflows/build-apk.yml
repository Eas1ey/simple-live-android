name: Build Simple Live Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract source code
        run: |
          unzip -q dart_simple_live-dev_v1.11.7.zip

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: dart_simple_live-dev_v1.11.7/simple_live_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: dart_simple_live-dev_v1.11.7/simple_live_app
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Rename APK
        run: |
          mkdir -p output
          cp dart_simple_live-dev_v1.11.7/simple_live_app/build/app/outputs/flutter-apk/app-release.apk \
             output/SimpleLive-v1.11.7-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-v1.11.7-Release
          path: output/*.apk
          retention-days: 30
